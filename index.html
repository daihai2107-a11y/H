<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tra Cứu Vận Đơn - GHN Express</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: { extend: { colors: { ghn: { orange: '#FA5400', dark: '#002D62', hover: '#D94800' } } } }
        }
    </script>
</head>
<body class="bg-gray-50 font-sans text-gray-800">

    <header class="bg-ghn-dark text-white shadow-md">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <span class="text-2xl font-extrabold tracking-wider">GHN <span class="text-ghn-orange">EXPRESS</span></span>
            <span class="bg-ghn-orange text-xs px-2.5 py-1 rounded-full font-bold">TRA CỨU CLOUD</span>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8 space-y-6">
        <div class="bg-white p-6 md:p-8 rounded-2xl shadow-lg text-center space-y-4">
            <h1 class="text-2xl font-bold text-ghn-dark">Tra Cứu Hành Trình Đơn Hàng</h1>
            <div class="flex max-w-xl mx-auto space-x-2">
                <input type="text" id="tracking-input" placeholder="Nhập mã vận đơn (VD: GHN123456)..." class="w-full px-4 py-3 border rounded-xl outline-none font-bold text-lg uppercase">
                <button onclick="searchOrder()" class="bg-ghn-orange text-white px-8 py-3 rounded-xl font-bold hover:bg-ghn-hover transition shadow">TRA CỨU</button>
            </div>
        </div>

        <div id="result-box" class="hidden bg-white p-6 rounded-2xl shadow space-y-4 border-l-8 border-ghn-orange">
            <div class="flex justify-between items-center border-b pb-3">
                <div><p class="text-xs text-gray-400 font-semibold">MÃ VẬN ĐƠN</p><h3 id="res-id" class="text-xl font-bold text-ghn-orange"></h3></div>
                <div><span id="res-badge" class="px-3 py-1 rounded-full text-xs font-bold"></span></div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">
                <div><p class="text-gray-500">Shop gửi: <b id="res-shop" class="text-gray-800"></b></p><p class="text-gray-500 mt-1">Người nhận: <b id="res-name" class="text-gray-800"></b> (<span id="res-phone"></span>)</p></div>
                <div><p class="text-gray-500">Địa chỉ: <b id="res-address" class="text-gray-800"></b></p><p class="text-gray-500 mt-1">Tiền COD: <b id="res-cod" class="text-ghn-orange font-bold"></b></p></div>
            </div>
            <div class="p-4 bg-orange-50 rounded-xl border border-orange-200">
                <p class="text-xs text-gray-500 font-semibold"><i class="fa-solid fa-location-dot text-ghn-orange mr-1"></i> Vị trí / Tiến trình mới nhất:</p>
                <p id="res-location" class="font-bold text-ghn-dark mt-1"></p>
                <p id="res-time" class="text-xs text-gray-400 mt-1"></p>
            </div>
        </div>

        <div id="not-found" class="hidden bg-white p-8 rounded-2xl shadow text-center space-y-2">
            <i class="fa-solid fa-triangle-exclamation text-3xl text-yellow-500"></i>
            <h3 class="font-bold">Không tìm thấy mã vận đơn</h3>
            <p class="text-sm text-gray-500">Vui lòng kiểm tra lại mã vận đơn của bạn.</p>
        </div>
    </main>

    <script>
        const API_URL = 'https://api.npoint.io/39e85da087cd860d55a7';

        async function searchOrder() {
            const code = document.getElementById('tracking-input').value.trim().toUpperCase();
            if(!code) { alert('Vui lòng nhập mã vận đơn!'); return; }

            try {
                const res = await fetch(API_URL);
                const orders = await res.json();
                const order = orders.find(o => o.id.toUpperCase() === code);

                if(order) {
                    document.getElementById('not-found').classList.add('hidden');
                    document.getElementById('result-box').classList.remove('hidden');

                    document.getElementById('res-id').innerText = order.id;
                    document.getElementById('res-shop').innerText = order.shopName;
                    document.getElementById('res-name').innerText = order.receiverName;
                    document.getElementById('res-phone').innerText = order.receiverPhone;
                    document.getElementById('res-address').innerText = order.receiverAddress;
                    document.getElementById('res-cod').innerText = order.cod.toLocaleString() + ' đ';
                    document.getElementById('res-location').innerText = order.location;
                    document.getElementById('res-time').innerText = 'Cập nhật lúc: ' + order.timestamp;
                    
                    const badge = document.getElementById('res-badge');
                    badge.innerText = order.status;
                    badge.className = `px-3 py-1 rounded-full text-xs font-bold ${order.status === 'Giao thành công' ? 'bg-green-100 text-green-800' : (order.status === 'Đang giao' ? 'bg-blue-100 text-blue-800' : 'bg-yellow-100 text-yellow-800')}`;
                } else {
                    document.getElementById('result-box').classList.add('hidden');
                    document.getElementById('not-found').classList.remove('hidden');
                }
            } catch(err) {
                alert('Lỗi kết nối đến máy chủ đám mây!');
            }
        }
    </script>
</body>
</html>
